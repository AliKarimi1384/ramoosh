<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1113">
  <script>
    // Apply the saved language and theme before the interface is painted.
    try {
      if (localStorage.getItem('ramoosh-language') === 'en') {
        document.documentElement.lang = 'en';
        document.documentElement.dir = 'ltr';
      }
    } catch { /* Persian remains the default when storage is unavailable. */ }
    try {
      const savedTheme = localStorage.getItem('ramoosh-theme');
      document.documentElement.dataset.theme = savedTheme === 'light' || savedTheme === 'dark'
        ? savedTheme
        : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    } catch {
      document.documentElement.dataset.theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
  </script>
  <meta name="description" content="رموش، فضای ساده‌ای برای گفت‌وگو درباره رمزنگاری و پردازش محلی پیام‌ها">
  <title>رموش | دستیار رمزنگاری</title>
  <link rel="icon" type="image/svg+xml" href="/src/ramoosh-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
